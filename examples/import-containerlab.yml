# Structure only. Runtime images do not declare protocol simulation support.
# Pass import-models.json explicitly to import_containerlab; this file is never deployed.
name: import-static-ipv4
topology:
  nodes:
    pc-a:
      kind: linux
      image: alpine:3.23
    r1:
      kind: linux
      image: alpine:3.23
    r2:
      kind: linux
      image: alpine:3.23
    pc-b:
      kind: linux
      image: alpine:3.23
  links:
    - endpoints: ["pc-a:eth1", "r1:eth1"]
    - type: veth
      endpoints:
        - node: r1
          interface: eth2
        - node: r2
          interface: eth1
    - endpoints: ["r2:eth2", "pc-b:eth1"]
